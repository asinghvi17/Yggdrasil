# Build Yggdrasil recipes with BinaryBuilder on GitHub-hosted runners.
#
# Runs on every push to `as/bb-ci`. One job per (recipe, platform). The platform
# lists below were computed from each recipe with BinaryBuilder's own platform
# expansion (`build_tarballs.jl --meta-json=...` + `.ci/bb1_project/generate_platforms.jl`);
# regenerate them if a recipe's `platforms` change.
#
# Mirrors what `.buildkite/build.sh` does for BB1 recipes: instantiate
# `.ci/bb1_project` (BinaryBuilder master) and run the recipe's
# `build_tarballs.jl --verbose <platform>` with that project.
name: BinaryBuilder build

on:
  push:
    branches:
      - as/bb-ci
      - as/bb-ci-wamr

permissions:
  contents: read

env:
  # Same package server settings as .buildkite/pipeline.yml
  JULIA_PKG_SERVER: us-east.pkg.julialang.org
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: eager
  JULIA_VERSION: '1.13.2' # Same version as .buildkite/pipeline.yml and the Manifests

jobs:
  # The only job that writes the depot cache: it instantiates and precompiles the
  # BinaryBuilder project once, and the build jobs restore that (restore-only).
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/clones
          key: bb-depot-${{ runner.os }}-${{ env.JULIA_VERSION }}-${{ hashFiles('.ci/bb1_project/Manifest.toml') }}
      - name: Instantiate BinaryBuilder project
        run: julia --color=yes --project=.ci/bb1_project -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'

  build:
    name: ${{ matrix.recipe }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {recipe: W/WAMR, platform: i686-linux-gnu}
          - {recipe: W/WAMR, platform: x86_64-linux-gnu}
          - {recipe: W/WAMR, platform: aarch64-linux-gnu}
          - {recipe: W/WAMR, platform: armv7l-linux-gnueabihf}
          - {recipe: W/WAMR, platform: riscv64-linux-gnu}
          - {recipe: W/WAMR, platform: i686-linux-musl}
          - {recipe: W/WAMR, platform: x86_64-linux-musl}
          - {recipe: W/WAMR, platform: aarch64-linux-musl}
          - {recipe: W/WAMR, platform: armv7l-linux-musleabihf}
          - {recipe: W/WAMR, platform: x86_64-apple-darwin}
          - {recipe: W/WAMR, platform: aarch64-apple-darwin}
          - {recipe: W/WAMR, platform: x86_64-unknown-freebsd}
          - {recipe: W/WAMR, platform: aarch64-unknown-freebsd}
    env:
      BB_PROJECT: ${{ github.workspace }}/.ci/bb1_project
      # Accept the macOS SDK license automatically (as Yggdrasil CI does)
      BINARYBUILDER_AUTOMATIC_APPLE: "true"
    steps:
      # Hosted runners have ~14 GB free; the BB rootfs, shards and build can exceed that.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ env.JULIA_VERSION }}

      # BinaryBuilder's sandbox needs unprivileged user namespaces, which
      # Ubuntu 24.04 restricts through AppArmor.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user --mount true && echo "user namespaces OK"

      - name: Restore Julia depot
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/clones
          key: bb-depot-${{ runner.os }}-${{ env.JULIA_VERSION }}-${{ hashFiles('.ci/bb1_project/Manifest.toml') }}

      - name: Instantiate BinaryBuilder project
        run: julia --color=yes --project="$BB_PROJECT" -e 'import Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Build
        working-directory: ${{ matrix.recipe }}
        run: |
          # The parallel auditor can open lots of files
          ulimit -n 65536 || ulimit -n "$(ulimit -Hn)"
          julia --color=yes --threads=auto --project="$BB_PROJECT" \
            build_tarballs.jl --verbose ${{ matrix.platform }}

      - name: Check GNU_STACK of ELF products
        if: success() && !contains(matrix.platform, 'apple-darwin') && !contains(matrix.platform, 'mingw32')
        working-directory: ${{ matrix.recipe }}
        run: |
          mkdir -p "$RUNNER_TEMP/extract" && cd "$RUNNER_TEMP/extract"
          tar xzf "$GITHUB_WORKSPACE/${{ matrix.recipe }}"/products/*.tar.gz
          for f in $(find . -name 'libiwasm*' -type f); do
            echo "== $f"
            readelf -lW "$f" | grep -E 'GNU_STACK'
            flags=$(readelf -lW "$f" | awk '/GNU_STACK/ {print $(NF-1)}')
            echo "GNU_STACK_RESULT ${{ matrix.platform }} $f flags=$flags"
            [ "$flags" = "RW" ] || { echo "executable stack!"; exit 1; }
          done

      - name: Show products
        if: always()
        working-directory: ${{ matrix.recipe }}
        run: ls -la products/ || true

      - name: Compute artifact name
        id: artifact
        run: echo "name=$(echo '${{ matrix.recipe }}' | tr '/@' --)-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: Upload products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ matrix.recipe }}/products/*
          if-no-files-found: error
